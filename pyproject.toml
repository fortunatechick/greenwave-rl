[project]
name = "greenwave-rl"
version = "1.0.0"
description = "Fairness-aware deep RL for adaptive signal control under mixed Indian traffic"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["greenwave*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web", ".venv", "runs", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"report/fill.py" = ["E501"]  # prose templates

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
