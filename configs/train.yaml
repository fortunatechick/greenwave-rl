# Agent hyperparameters (spec Section 7).
ddqn:
  gamma: 0.99
  lr: 1.0e-4
  buffer_size: 50000
  batch_size: 64
  target_update: 500
  learning_starts: 2000
  train_freq: 1
  eps_start: 1.0
  eps_end: 0.05
  eps_fraction: 0.5
  grad_clip: 10.0
  hidden: [128, 128]

sb3_dqn:        # vanilla DQN (not Double DQN)
  learning_rate: 1.0e-4
  buffer_size: 50000
  batch_size: 64
  gamma: 0.99
  target_update_interval: 500
  exploration_fraction: 0.5
  exploration_final_eps: 0.05
  learning_starts: 2000
  train_freq: 1
  gradient_steps: 1
  max_grad_norm: 10
  net_arch: [128, 128]

ppo:
  n_envs: 4
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  net_arch: [128, 128]

eval_every: 10000
