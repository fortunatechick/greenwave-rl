name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # Shorter safety sweep in CI; the full 100-episode check runs locally.
      GREENWAVE_SAFETY_EPISODES: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.in
      - name: Lint
        run: ruff check .
      - name: Build networks and demand
        run: |
          python network/build_network.py
          python network/build_network.py --toy
          python demand/generate.py
      - name: Tests (300 s episodes)
        run: pytest -q
      - name: Quick-profile smoke training
        run: |
          python -m greenwave.train --name ci_smoke --network toy --reward wait --steps 2000 --eval-every 1000

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build (fails if mock data would ship)
        run: npm run build
        env:
          CI_REQUIRE_REAL_DATA: "1"
